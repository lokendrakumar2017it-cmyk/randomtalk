<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ishanvi Video Chat</title>
  
  <!-- PeerJS & Firebase SDKs -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      background: #060913;
      overflow: hidden;
      color: #fff;
    }

    .video-call-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #0f172a 0%, #060913 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Radar Pulse Animation */
    .radar-box {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
      pointer-events: none;
    }

    .radar-circle {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .radar-wave {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid rgba(56, 189, 248, 0.4);
      animation: ripple 2s cubic-bezier(0.1, 0.2, 0.3, 1) infinite;
    }

    .radar-wave:nth-child(2) {
      animation-delay: 0.6s;
    }

    .radar-wave:nth-child(3) {
      animation-delay: 1.2s;
    }

    .radar-center-icon {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.6);
      z-index: 2;
    }

    .radar-center-icon svg {
      width: 28px;
      height: 28px;
      fill: #fff;
    }

    .radar-text {
      margin-top: 20px;
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.5px;
      animation: textPulse 1.8s ease-in-out infinite;
    }

    @keyframes ripple {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    @keyframes textPulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* 1. Fullscreen Stranger Video */
    #remoteVideo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      z-index: 2;
    }

    /* 2. Floating User Video Frame */
    #localVideo {
      position: absolute;
      top: 80px;
      right: 18px;
      width: 110px;
      height: 155px;
      border-radius: 18px;
      object-fit: cover;
      background: #0f172a;
      border: 2px solid rgba(56, 189, 248, 0.7);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 15px rgba(56, 189, 248, 0.25);
      z-index: 20;
      transform: scaleX(-1);
    }

    /* Brand Header */
    .brand-header {
      position: absolute;
      top: 12px;
      left: 14px;
      right: 14px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.65);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      z-index: 25;
    }

    .logo-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #0ea5e9, #3b82f6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 12px rgba(14, 165, 233, 0.45);
    }

    .logo-icon svg {
      width: 19px;
      height: 19px;
      fill: #ffffff;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.3px;
      text-transform: capitalize;
    }

    .brand-title span {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: #34d399;
      background: rgba(52, 211, 153, 0.12);
      padding: 5px 11px;
      border-radius: 20px;
      border: 1px solid rgba(52, 211, 153, 0.3);
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 8px #34d399;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Floating Dock Controls */
    .call-controls {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.7);
      padding: 8px 16px;
      border-radius: 50px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
    }

    .control-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .control-btn:active {
      transform: scale(0.9);
    }

    .control-btn svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }

    .control-btn.off {
      background: #ef4444;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
    }

    .btn-cut {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(225, 29, 72, 0.5);
      transition: transform 0.2s ease;
    }

    .btn-cut:active {
      transform: scale(0.9);
    }

    .btn-cut svg {
      width: 22px;
      height: 22px;
      fill: #ffffff;
      transform: rotate(135deg);
    }

    /* Thank You Screen */
    .thankyou-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #060913;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      z-index: 100;
    }

    .thankyou-card {
      background: rgba(15, 23, 42, 0.85);
      padding: 40px 24px;
      border-radius: 28px;
      max-width: 360px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .heart-icon {
      width: 64px;
      height: 64px;
      background: rgba(56, 189, 248, 0.12);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
    }

    .heart-icon svg {
      width: 32px;
      height: 32px;
      fill: #38bdf8;
    }

    .thankyou-title {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.3;
    }

    .thankyou-title span {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .thankyou-desc {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
    }

    .btn-reconnect {
      background: linear-gradient(135deg, #0ea5e9, #3b82f6);
      color: #ffffff;
      border: none;
      padding: 13px 32px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 6px 20px rgba(14, 165, 233, 0.4);
    }
  </style>
</head>
<body>

  <div class="video-call-container" id="videoContainer">
    <!-- Top Header -->
    <div class="brand-header">
      <div class="logo-box">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24">
            <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
          </svg>
        </div>
        <div class="brand-title">ishanvi <span>video chat</span></div>
      </div>
      <div class="live-badge">
        <span class="live-dot"></span>
        <span>LIVE</span>
      </div>
    </div>

    <!-- Waiting Animation Screen -->
    <div class="radar-box" id="radarBox">
      <div class="radar-circle">
        <div class="radar-wave"></div>
        <div class="radar-wave"></div>
        <div class="radar-wave"></div>
        <div class="radar-center-icon">
          <svg viewBox="0 0 24 24">
            <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 0 0-1.01.24l-1.57 1.97c-2.83-1.44-5.15-3.75-6.59-6.59l1.97-1.57c.28-.28.37-.68.25-1.02A11.36 11.36 0 0 1 8.5 4.31c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.5c0-.55-.45-1-1-1z"/>
          </svg>
        </div>
      </div>
      <div class="radar-text">Waiting for call pickup</div>
    </div>

    <!-- Videos -->
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>

    <!-- Controls -->
    <div class="call-controls">
      <button class="control-btn" id="micBtn" title="Mute/Unmute Mic">
        <svg id="micIcon" viewBox="0 0 24 24">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </button>

      <button class="control-btn" id="camBtn" title="Camera On/Off">
        <svg id="camIcon" viewBox="0 0 24 24">
          <path d="M15 8v8H5V8h10m1-2H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4V7c0-.55-.45-1-1-1z"/>
        </svg>
      </button>

      <button class="control-btn" id="flipBtn" title="Switch Camera">
        <svg viewBox="0 0 24 24">
          <path d="M9.01 14H2v2h7.01v3L13 15l-3.99-4v3zm5.98-1v-3H22V8h-7.01V5L11 9l3.99 4z"/>
        </svg>
      </button>

      <button class="btn-cut" id="callCutBtn" title="End Call">
        <svg viewBox="0 0 24 24">
          <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 0 0-1.01.24l-1.57 1.97c-2.83-1.44-5.15-3.75-6.59-6.59l1.97-1.57c.28-.28.37-.68.25-1.02A11.36 11.36 0 0 1 8.5 4.31c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.5c0-.55-.45-1-1-1z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Thank You Screen -->
  <div class="thankyou-screen" id="thankyouScreen">
    <div class="thankyou-card">
      <div class="heart-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </div>
      <div class="thankyou-title">Thank you for using <br><span>ishanvi video chat</span></div>
      <div class="thankyou-desc">Call disconnected successfully. We hope you enjoyed your conversation!</div>
      <button class="btn-reconnect" onclick="location.reload()">Start New Call</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBju6Q8VGk8iGz0yfnKw07-6RHKZfQt78E",
      authDomain: "randomtalk-9cd6c.firebaseapp.com",
      databaseURL: "https://randomtalk-9cd6c-default-rtdb.firebaseio.com",
      projectId: "randomtalk-9cd6c",
      storageBucket: "randomtalk-9cd6c.firebasestorage.app",
      messagingSenderId: "104855361284",
      appId: "1:104855361284:web:8f04006b2a1eb7a43ca251"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    const queueRef = db.ref("waiting_queue");

    const localVideo = document.getElementById("localVideo");
    const remoteVideo = document.getElementById("remoteVideo");
    const radarBox = document.getElementById("radarBox");
    const callCutBtn = document.getElementById("callCutBtn");
    const micBtn = document.getElementById("micBtn");
    const camBtn = document.getElementById("camBtn");
    const flipBtn = document.getElementById("flipBtn");
    const videoContainer = document.getElementById("videoContainer");
    const thankyouScreen = document.getElementById("thankyouScreen");

    let localStream = null;
    let peer = null;
    let myPeerId = null;
    let currentCall = null;

    let isAudioMuted = false;
    let isVideoStopped = false;
    let currentFacingMode = "user";

    // Camera Start First
    async function startCamera(facingMode = "user") {
      try {
        if (localStream) {
          localStream.getTracks().forEach(track => track.stop());
        }

        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode, width: { ideal: 640 }, height: { ideal: 480 } },
          audio: true
        });

        localVideo.srcObject = localStream;
        localVideo.style.transform = facingMode === "user" ? "scaleX(-1)" : "scaleX(1)";

        if (isAudioMuted) {
          localStream.getAudioTracks().forEach(t => t.enabled = false);
        }
        if (isVideoStopped) {
          localStream.getVideoTracks().forEach(t => t.enabled = false);
          localVideo.style.opacity = "0.2";
        }

        if (currentCall && currentCall.peerConnection) {
          const videoTrack = localStream.getVideoTracks()[0];
          const senders = currentCall.peerConnection.getSenders();
          const videoSender = senders.find(s => s.track && s.track.kind === 'video');
          if (videoSender) {
            videoSender.replaceTrack(videoTrack);
          }
        }

        // Camera on hote hi Peer shuru karein
        if (!peer) {
          initPeer();
        }
      } catch (err) {
        alert("Please allow Camera & Microphone permission in browser.");
      }
    }

    function initPeer() {
      peer = new Peer({
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      });

      peer.on('open', (id) => {
        myPeerId = id;
        findMatch();
      });

      // Answering Incoming Call
      peer.on('call', (call) => {
        if (!localStream) return;
        call.answer(localStream);
        setupCallHandlers(call);
      });

      peer.on('disconnected', () => {
        if (!peer.destroyed) peer.reconnect();
      });
    }

    function findMatch() {
      radarBox.style.display = "flex";
      remoteVideo.srcObject = null;

      queueRef.once('value', (snapshot) => {
        const queue = snapshot.val() || {};
        const availablePeers = Object.keys(queue).filter(id => id !== myPeerId);

        if (availablePeers.length > 0) {
          const partnerId = availablePeers[0];
          queueRef.child(partnerId).remove();
          connectToStranger(partnerId);
        } else {
          queueRef.child(myPeerId).set(true);
          queueRef.child(myPeerId).onDisconnect().remove();
        }
      });
    }

    function connectToStranger(strangerId) {
      if (!localStream) return;
      const call = peer.call(strangerId, localStream);
      setupCallHandlers(call);
    }

    function setupCallHandlers(call) {
      currentCall = call;

      // Handle stream event
      call.on('stream', (stream) => {
        remoteVideo.srcObject = stream;
        radarBox.style.display = "none";
        
        // Mobile Chrome Autoplay Fallback
        remoteVideo.play().catch(() => {
          document.body.addEventListener('click', () => {
            remoteVideo.play();
          }, { once: true });
        });
      });

      call.on('close', () => {
        handleDisconnect();
      });

      call.on('error', () => {
        handleDisconnect();
      });
    }

    function handleDisconnect() {
      resetSession();
      findMatch();
    }

    function resetSession() {
      if (currentCall) currentCall.close();
      remoteVideo.srcObject = null;
      radarBox.style.display = "flex";
      if (myPeerId) queueRef.child(myPeerId).remove();
    }

    micBtn.addEventListener("click", () => {
      if (!localStream) return;
      isAudioMuted = !isAudioMuted;
      localStream.getAudioTracks().forEach(track => {
        track.enabled = !isAudioMuted;
      });
      micBtn.classList.toggle("off", isAudioMuted);
    });

    camBtn.addEventListener("click", () => {
      if (!localStream) return;
      isVideoStopped = !isVideoStopped;
      localStream.getVideoTracks().forEach(track => {
        track.enabled = !isVideoStopped;
      });
      camBtn.classList.toggle("off", isVideoStopped);
      localVideo.style.opacity = isVideoStopped ? "0.2" : "1";
    });

    flipBtn.addEventListener("click", () => {
      currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
      startCamera(currentFacingMode);
    });

    callCutBtn.addEventListener("click", () => {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }
      resetSession();
      if (peer) peer.destroy();
      videoContainer.style.display = "none";
      thankyouScreen.style.display = "flex";
    });

    window.addEventListener("beforeunload", () => {
      resetSession();
    });

    // Start with Camera
    startCamera(currentFacingMode);
  </script>
</body>
</html>
