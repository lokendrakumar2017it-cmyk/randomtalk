<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RandomTalk - Random Video Chat</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    .main-container {
      background: #1e293b;
      width: 100%;
      max-width: 480px;
      height: 94vh;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    /* Video Section */
    .video-section {
      position: relative;
      flex: 1.1;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #remoteVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #localVideo {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 110px;
      height: 140px;
      border-radius: 12px;
      object-fit: cover;
      border: 2px solid #38bdf8;
      background: #111;
      z-index: 10;
    }

    .video-status {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }

    /* Chat Section */
    .chat-section {
      flex: 1;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      overflow: hidden;
    }

    .chat-messages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #f8fafc;
    }

    .msg {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 13px;
      word-break: break-word;
    }

    .msg.stranger {
      background: #e2e8f0;
      color: #0f172a;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }

    .msg.you {
      background: #2563eb;
      color: #ffffff;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    .msg.system {
      align-self: center;
      font-size: 11px;
      color: #64748b;
      background: transparent;
      padding: 2px;
    }

    /* Form & Controls */
    .chat-input-bar {
      padding: 10px;
      display: flex;
      gap: 6px;
      background: #fff;
      border-top: 1px solid #e2e8f0;
    }

    .chat-input-bar input {
      flex: 1;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 14px;
      outline: none;
    }

    .chat-input-bar button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 0 16px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .control-actions {
      display: flex;
      gap: 8px;
      padding: 8px 10px 12px;
      background: #fff;
    }

    .btn-action {
      flex: 1;
      padding: 9px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13px;
      border: none;
      cursor: pointer;
    }

    .btn-next { background: #0f172a; color: #fff; }
    .btn-report { background: #fee2e2; color: #dc2626; }
  </style>
</head>
<body>

  <div class="main-container">
    <!-- Videos -->
    <div class="video-section">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
      <div class="video-status" id="videoStatus">Camera Loading...</div>
    </div>

    <!-- Chat & Controls -->
    <div class="chat-section">
      <div class="chat-messages" id="chatBox">
        <div class="msg system">Starting camera & looking for stranger...</div>
      </div>

      <form class="chat-input-bar" id="chatForm">
        <input type="text" id="msgInput" placeholder="Type a message..." autocomplete="off">
        <button type="submit" id="sendBtn">Send</button>
      </form>

      <div class="control-actions">
        <button class="btn-action btn-next" id="nextBtn">Find / Next</button>
        <button class="btn-action btn-report">Report</button>
      </div>
    </div>
  </div>

  <script>
    const localVideo = document.getElementById("localVideo");
    const remoteVideo = document.getElementById("remoteVideo");
    const videoStatus = document.getElementById("videoStatus");
    const chatBox = document.getElementById("chatBox");
    const chatForm = document.getElementById("chatForm");
    const msgInput = document.getElementById("msgInput");
    const nextBtn = document.getElementById("nextBtn");

    let localStream = null;
    let peer = null;
    let currentCall = null;
    let dataConn = null;

    // 1. Camera & Mic Permission
    async function startCamera() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: true
        });
        localVideo.srcObject = localStream;
        videoStatus.innerText = "Connecting to matchmaking...";
        initPeer();
      } catch (err) {
        videoStatus.innerText = "Camera/Mic Permission Denied";
        appendMsg("Camera permission allow karein video chat ke liye.", "system");
      }
    }

    // 2. Initialize PeerJS
    function initPeer() {
      peer = new Peer({
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      });

      peer.on('open', (id) => {
        videoStatus.innerText = "Searching for stranger...";
      });

      // Receive incoming Video Call
      peer.on('call', (call) => {
        call.answer(localStream);
        handleCall(call);
      });

      // Receive incoming Text Chat Connection
      peer.on('connection', (conn) => {
        dataConn = conn;
        setupDataConnection();
      });
    }

    function handleCall(call) {
      currentCall = call;
      call.on('stream', (remoteStream) => {
        remoteVideo.srcObject = remoteStream;
        videoStatus.innerText = "Connected";
      });

      call.on('close', () => {
        resetConnection();
      });
    }

    function setupDataConnection() {
      dataConn.on('data', (data) => {
        appendMsg(data, "stranger");
      });

      dataConn.on('close', () => {
        appendMsg("Stranger disconnected.", "system");
      });
    }

    function appendMsg(text, type) {
      const div = document.createElement("div");
      div.className = `msg ${type}`;
      div.innerText = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Chat Send
    chatForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = msgInput.value.trim();
      if (!text) return;

      if (dataConn && dataConn.open) {
        dataConn.send(text);
      }
      appendMsg(text, "you");
      msgInput.value = "";
    });

    // Next / Skip Stranger
    nextBtn.addEventListener("click", () => {
      resetConnection();
      appendMsg("Finding new partner...", "system");
      if (peer) {
        peer.destroy();
        initPeer();
      }
    });

    function resetConnection() {
      if (currentCall) currentCall.close();
      if (dataConn) dataConn.close();
      remoteVideo.srcObject = null;
      videoStatus.innerText = "Searching...";
    }

    // Start
    startCamera();
  </script>
</body>
</html>
