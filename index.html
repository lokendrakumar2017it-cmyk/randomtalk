<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ishanvi Video Chat</title>
  
  <!-- PeerJS & Firebase SDKs -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #0b0f19;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 8px;
    }

    .main-container {
      background: #1e293b;
      width: 100%;
      max-width: 480px;
      height: 96vh;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Fixed Brand Header */
    .brand-header {
      background: #0f172a;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
      z-index: 50;
    }

    .logo-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
    }

    .logo-icon svg {
      width: 18px;
      height: 18px;
      fill: #ffffff;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 800;
      color: #ffffff !important;
      letter-spacing: -0.3px;
      text-transform: capitalize;
    }

    .brand-title span {
      color: #38bdf8 !important;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
      color: #4ade80;
      background: rgba(74, 222, 128, 0.1);
      padding: 4px 8px;
      border-radius: 14px;
      border: 1px solid rgba(74, 222, 128, 0.25);
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Video Section */
    .video-section {
      position: relative;
      flex: 1.1;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #remoteVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #localVideo {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 95px;
      height: 125px;
      border-radius: 12px;
      object-fit: cover;
      border: 2px solid #38bdf8;
      background: #111;
      z-index: 10;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    .video-status {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }

    /* Chat Section */
    .chat-section {
      flex: 1;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      border-top-left-radius: 18px;
      border-top-right-radius: 18px;
      overflow: hidden;
    }

    .chat-messages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #f8fafc;
    }

    .msg {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 13px;
      word-break: break-word;
    }

    .msg.stranger {
      background: #e2e8f0;
      color: #0f172a;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }

    .msg.you {
      background: #2563eb;
      color: #ffffff;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    .msg.system {
      align-self: center;
      font-size: 11px;
      color: #64748b;
      background: transparent;
      padding: 2px;
    }

    .chat-input-bar {
      padding: 8px 10px;
      display: flex;
      gap: 6px;
      background: #fff;
      border-top: 1px solid #e2e8f0;
    }

    .chat-input-bar input {
      flex: 1;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      outline: none;
    }

    .chat-input-bar button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 0 16px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .control-actions {
      display: flex;
      gap: 8px;
      padding: 6px 10px 10px;
      background: #fff;
    }

    .btn-action {
      flex: 1;
      padding: 9px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 12px;
      border: none;
      cursor: pointer;
    }

    .btn-next { background: #0f172a; color: #fff; }
    .btn-report { background: #fee2e2; color: #dc2626; }
  </style>
</head>
<body>

  <div class="main-container">
    <!-- Brand Header -->
    <div class="brand-header">
      <div class="logo-box">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24">
            <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
          </svg>
        </div>
        <div class="brand-title">ishanvi <span>video chat</span></div>
      </div>
      <div class="live-badge">
        <span class="live-dot"></span>
        <span>LIVE</span>
      </div>
    </div>

    <!-- Video Section -->
    <div class="video-section">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
      <div class="video-status" id="videoStatus">Camera Loading...</div>
    </div>

    <!-- Chat & Controls -->
    <div class="chat-section">
      <div class="chat-messages" id="chatBox">
        <div class="msg system">Starting camera & finding partner...</div>
      </div>

      <form class="chat-input-bar" id="chatForm">
        <input type="text" id="msgInput" placeholder="Type a message..." autocomplete="off">
        <button type="submit" id="sendBtn">Send</button>
      </form>

      <div class="control-actions">
        <button class="btn-action btn-next" id="nextBtn">Find / Next</button>
        <button class="btn-action btn-report">Report</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBju6Q8VGk8iGz0yfnKw07-6RHKZfQt78E",
      authDomain: "randomtalk-9cd6c.firebaseapp.com",
      databaseURL: "https://randomtalk-9cd6c-default-rtdb.firebaseio.com",
      projectId: "randomtalk-9cd6c",
      storageBucket: "randomtalk-9cd6c.firebasestorage.app",
      messagingSenderId: "104855361284",
      appId: "1:104855361284:web:8f04006b2a1eb7a43ca251"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    const queueRef = db.ref("waiting_queue");

    const localVideo = document.getElementById("localVideo");
    const remoteVideo = document.getElementById("remoteVideo");
    const videoStatus = document.getElementById("videoStatus");
    const chatBox = document.getElementById("chatBox");
    const chatForm = document.getElementById("chatForm");
    const msgInput = document.getElementById("msgInput");
    const nextBtn = document.getElementById("nextBtn");

    let localStream = null;
    let peer = null;
    let myPeerId = null;
    let currentCall = null;
    let dataConn = null;

    async function startCamera() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        localVideo.srcObject = localStream;
        videoStatus.innerText = "Connecting...";
        initPeer();
      } catch (err) {
        videoStatus.innerText = "Camera Permission Required";
        appendMsg("Please allow camera and mic permissions.", "system");
      }
    }

    function initPeer() {
      peer = new Peer({
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      });

      peer.on('open', (id) => {
        myPeerId = id;
        findMatch();
      });

      peer.on('call', (call) => {
        call.answer(localStream);
        setupCallHandlers(call);
      });

      peer.on('connection', (conn) => {
        dataConn = conn;
        setupDataHandlers();
      });
    }

    function findMatch() {
      videoStatus.innerText = "Searching for stranger...";
      appendMsg("Looking for someone to talk to...", "system");

      queueRef.once('value', (snapshot) => {
        const queue = snapshot.val() || {};
        const availablePeers = Object.keys(queue).filter(id => id !== myPeerId);

        if (availablePeers.length > 0) {
          const partnerId = availablePeers[0];
          queueRef.child(partnerId).remove();
          connectToStranger(partnerId);
        } else {
          queueRef.child(myPeerId).set(true);
          queueRef.child(myPeerId).onDisconnect().remove();
        }
      });
    }

    function connectToStranger(strangerId) {
      videoStatus.innerText = "Connecting...";

      const call = peer.call(strangerId, localStream);
      setupCallHandlers(call);

      dataConn = peer.connect(strangerId);
      setupDataHandlers();
    }

    function setupCallHandlers(call) {
      currentCall = call;
      call.on('stream', (stream) => {
        remoteVideo.srcObject = stream;
        videoStatus.innerText = "Connected";
        appendMsg("Connected! Say hi to stranger.", "system");
      });

      call.on('close', () => {
        handleDisconnect();
      });
    }

    function setupDataHandlers() {
      dataConn.on('data', (data) => {
        appendMsg(data, "stranger");
      });

      dataConn.on('close', () => {
        handleDisconnect();
      });
    }

    function handleDisconnect() {
      appendMsg("Stranger disconnected.", "system");
      resetSession();
    }

    function resetSession() {
      if (currentCall) currentCall.close();
      if (dataConn) dataConn.close();
      remoteVideo.srcObject = null;
      if (myPeerId) queueRef.child(myPeerId).remove();
    }

    function appendMsg(text, type) {
      const div = document.createElement("div");
      div.className = `msg ${type}`;
      div.innerText = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    chatForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = msgInput.value.trim();
      if (!text) return;

      if (dataConn && dataConn.open) {
        dataConn.send(text);
      }
      appendMsg(text, "you");
      msgInput.value = "";
    });

    nextBtn.addEventListener("click", () => {
      resetSession();
      chatBox.innerHTML = "";
      findMatch();
    });

    window.addEventListener("beforeunload", () => {
      resetSession();
    });

    startCamera();
  </script>
</body>
</html>
