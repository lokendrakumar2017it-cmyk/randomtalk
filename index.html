<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ishanvi Video Chat</title>
  
  <!-- PeerJS & Firebase SDKs -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .video-call-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #0b0f19;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* 1. Fullscreen Stranger Video */
    #remoteVideo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #0b0f19;
      z-index: 1;
    }

    /* 2. Floating User Video */
    #localVideo {
      position: absolute;
      top: 75px;
      right: 16px;
      width: 105px;
      height: 145px;
      border-radius: 14px;
      object-fit: cover;
      background: #111827;
      border: 2px solid rgba(56, 189, 248, 0.9);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
      z-index: 15;
      transform: scaleX(-1);
      transition: opacity 0.2s ease;
    }

    /* Top Brand Header */
    .brand-header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(15, 23, 42, 0.85), transparent);
      z-index: 25;
    }

    .logo-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
    }

    .logo-icon svg {
      width: 18px;
      height: 18px;
      fill: #ffffff;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.3px;
      text-transform: capitalize;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }

    .brand-title span {
      color: #38bdf8;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: #4ade80;
      background: rgba(74, 222, 128, 0.15);
      padding: 4px 10px;
      border-radius: 14px;
      border: 1px solid rgba(74, 222, 128, 0.3);
      backdrop-filter: blur(4px);
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Connection Status */
    .video-status {
      position: absolute;
      bottom: 110px;
      left: 18px;
      background: rgba(0, 0, 0, 0.65);
      color: #ffffff;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 20px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 25;
      transition: background 0.3s ease;
    }

    .video-status.warning {
      background: rgba(234, 179, 8, 0.85);
      color: #000;
      font-weight: 600;
    }

    /* Bottom Control Bar */
    .call-controls {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.75);
      padding: 8px 14px;
      border-radius: 40px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .control-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .control-btn:active {
      transform: scale(0.92);
    }

    .control-btn svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }

    .control-btn.off {
      background: #ef4444;
    }

    .btn-cut {
      background: #ef4444;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.5);
      transition: transform 0.2s ease;
    }

    .btn-cut:active {
      transform: scale(0.92);
    }

    .btn-cut svg {
      width: 22px;
      height: 22px;
      fill: #ffffff;
      transform: rotate(135deg);
    }

    /* Thank You Screen */
    .thankyou-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0b0f19;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      z-index: 100;
    }

    .thankyou-card {
      background: #1e293b;
      padding: 36px 24px;
      border-radius: 24px;
      max-width: 360px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .heart-icon {
      width: 60px;
      height: 60px;
      background: rgba(56, 189, 248, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .heart-icon svg {
      width: 32px;
      height: 32px;
      fill: #38bdf8;
    }

    .thankyou-title {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.3;
    }

    .thankyou-title span {
      color: #38bdf8;
    }

    .thankyou-desc {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
    }

    .btn-reconnect {
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
    }
  </style>
</head>
<body>

  <div class="video-call-container" id="videoContainer">
    <div class="brand-header">
      <div class="logo-box">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24">
            <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
          </svg>
        </div>
        <div class="brand-title">ishanvi <span>video chat</span></div>
      </div>
      <div class="live-badge">
        <span class="live-dot"></span>
        <span>LIVE</span>
      </div>
    </div>

    <!-- Videos -->
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>

    <!-- Network / Call Status Badge -->
    <div class="video-status" id="videoStatus">Connecting...</div>

    <!-- Controls -->
    <div class="call-controls">
      <button class="control-btn" id="micBtn" title="Mute/Unmute Mic">
        <svg id="micIcon" viewBox="0 0 24 24">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </button>

      <button class="control-btn" id="camBtn" title="Camera On/Off">
        <svg id="camIcon" viewBox="0 0 24 24">
          <path d="M15 8v8H5V8h10m1-2H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4V7c0-.55-.45-1-1-1z"/>
        </svg>
      </button>

      <button class="control-btn" id="flipBtn" title="Switch Camera">
        <svg viewBox="0 0 24 24">
          <path d="M9.01 14H2v2h7.01v3L13 15l-3.99-4v3zm5.98-1v-3H22V8h-7.01V5L11 9l3.99 4z"/>
        </svg>
      </button>

      <button class="btn-cut" id="callCutBtn" title="End Call">
        <svg viewBox="0 0 24 24">
          <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 0 0-1.01.24l-1.57 1.97c-2.83-1.44-5.15-3.75-6.59-6.59l1.97-1.57c.28-.28.37-.68.25-1.02A11.36 11.36 0 0 1 8.5 4.31c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.5c0-.55-.45-1-1-1z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Thank You Screen -->
  <div class="thankyou-screen" id="thankyouScreen">
    <div class="thankyou-card">
      <div class="heart-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </div>
      <div class="thankyou-title">Thank you for using <br><span>ishanvi video chat</span></div>
      <div class="thankyou-desc">Call disconnected successfully. We hope you enjoyed your conversation!</div>
      <button class="btn-reconnect" onclick="location.reload()">Start New Call</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBju6Q8VGk8iGz0yfnKw07-6RHKZfQt78E",
      authDomain: "randomtalk-9cd6c.firebaseapp.com",
      databaseURL: "https://randomtalk-9cd6c-default-rtdb.firebaseio.com",
      projectId: "randomtalk-9cd6c",
      storageBucket: "randomtalk-9cd6c.firebasestorage.app",
      messagingSenderId: "104855361284",
      appId: "1:104855361284:web:8f04006b2a1eb7a43ca251"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    const queueRef = db.ref("waiting_queue");

    const localVideo = document.getElementById("localVideo");
    const remoteVideo = document.getElementById("remoteVideo");
    const videoStatus = document.getElementById("videoStatus");
    const callCutBtn = document.getElementById("callCutBtn");
    const micBtn = document.getElementById("micBtn");
    const camBtn = document.getElementById("camBtn");
    const flipBtn = document.getElementById("flipBtn");
    const videoContainer = document.getElementById("videoContainer");
    const thankyouScreen = document.getElementById("thankyouScreen");

    let localStream = null;
    let peer = null;
    let myPeerId = null;
    let currentCall = null;
    let disconnectGraceTimer = null;

    let isAudioMuted = false;
    let isVideoStopped = false;
    let currentFacingMode = "user";

    function updateStatus(text, isWarning = false) {
      videoStatus.innerText = text;
      if (isWarning) {
        videoStatus.classList.add("warning");
      } else {
        videoStatus.classList.remove("warning");
      }
    }

    async function startCamera(facingMode = "user") {
      try {
        if (localStream) {
          localStream.getTracks().forEach(track => track.stop());
        }

        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode, width: { ideal: 640 }, height: { ideal: 480 } },
          audio: true
        });

        localVideo.srcObject = localStream;
        localVideo.style.transform = facingMode === "user" ? "scaleX(-1)" : "scaleX(1)";

        if (isAudioMuted) {
          localStream.getAudioTracks().forEach(t => t.enabled = false);
        }
        if (isVideoStopped) {
          localStream.getVideoTracks().forEach(t => t.enabled = false);
          localVideo.style.opacity = "0.2";
        }

        if (currentCall && currentCall.peerConnection) {
          const videoTrack = localStream.getVideoTracks()[0];
          const senders = currentCall.peerConnection.getSenders();
          const videoSender = senders.find(s => s.track && s.track.kind === 'video');
          if (videoSender) {
            videoSender.replaceTrack(videoTrack);
          }
        }

        if (!peer) {
          updateStatus("Connecting...");
          initPeer();
        }
      } catch (err) {
        updateStatus("Camera Permission Required", true);
      }
    }

    function initPeer() {
      peer = new Peer({
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' }
          ],
          iceCandidatePoolSize: 10
        }
      });

      peer.on('open', (id) => {
        myPeerId = id;
        findMatch();
      });

      peer.on('call', (call) => {
        call.answer(localStream);
        setupCallHandlers(call);
      });

      peer.on('disconnected', () => {
        updateStatus("Reconnecting to server...", true);
        if (!peer.destroyed) {
          peer.reconnect();
        }
      });

      peer.on('error', (err) => {
        console.warn("Peer error:", err);
      });
    }

    function findMatch() {
      updateStatus("Connecting...");

      queueRef.once('value', (snapshot) => {
        const queue = snapshot.val() || {};
        const availablePeers = Object.keys(queue).filter(id => id !== myPeerId);

        if (availablePeers.length > 0) {
          const partnerId = availablePeers[0];
          queueRef.child(partnerId).remove();
          connectToStranger(partnerId);
        } else {
          queueRef.child(myPeerId).set(true);
          queueRef.child(myPeerId).onDisconnect().remove();
        }
      });
    }

    function connectToStranger(strangerId) {
      updateStatus("Connecting...");
      const call = peer.call(strangerId, localStream);
      setupCallHandlers(call);
    }

    function setupCallHandlers(call) {
      currentCall = call;

      call.on('stream', (stream) => {
        remoteVideo.srcObject = stream;
        updateStatus("Connected");
        clearTimeout(disconnectGraceTimer);
      });

      // WebRTC connection state monitoring (Low network / Disconnect recovery)
      const pc = call.peerConnection;
      if (pc) {
        pc.oniceconnectionstatechange = () => {
          const state = pc.iceConnectionState;
          if (state === "disconnected") {
            updateStatus("Poor Network: Reconnecting...", true);
            // Trigger automatic ICE restart
            if (pc.restartIce) {
              pc.restartIce();
            }
            // 12 second grace period before dropping
            clearTimeout(disconnectGraceTimer);
            disconnectGraceTimer = setTimeout(() => {
              if (pc.iceConnectionState === "disconnected" || pc.iceConnectionState === "failed") {
                handleDisconnect();
              }
            }, 12000);
          } else if (state === "connected" || state === "completed") {
            clearTimeout(disconnectGraceTimer);
            updateStatus("Connected");
          } else if (state === "failed") {
            updateStatus("Connection Lost", true);
            handleDisconnect();
          }
        };
      }

      call.on('close', () => {
        handleDisconnect();
      });
    }

    function handleDisconnect() {
      clearTimeout(disconnectGraceTimer);
      resetSession();
      findMatch();
    }

    function resetSession() {
      if (currentCall) currentCall.close();
      remoteVideo.srcObject = null;
      updateStatus("Connecting...");
      if (myPeerId) queueRef.child(myPeerId).remove();
    }

    // Phone Network Events (Data Drop / Reconnect)
    window.addEventListener('offline', () => {
      updateStatus("No Internet Connection", true);
    });

    window.addEventListener('online', () => {
      updateStatus("Internet Restored. Resuming...", false);
      if (peer && peer.disconnected) {
        peer.reconnect();
      }
      if (currentCall && currentCall.peerConnection && currentCall.peerConnection.restartIce) {
        currentCall.peerConnection.restartIce();
      }
    });

    // Control buttons
    micBtn.addEventListener("click", () => {
      if (!localStream) return;
      isAudioMuted = !isAudioMuted;
      localStream.getAudioTracks().forEach(track => {
        track.enabled = !isAudioMuted;
      });
      micBtn.classList.toggle("off", isAudioMuted);
    });

    camBtn.addEventListener("click", () => {
      if (!localStream) return;
      isVideoStopped = !isVideoStopped;
      localStream.getVideoTracks().forEach(track => {
        track.enabled = !isVideoStopped;
      });
      camBtn.classList.toggle("off", isVideoStopped);
      localVideo.style.opacity = isVideoStopped ? "0.2" : "1";
    });

    flipBtn.addEventListener("click", () => {
      currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
      startCamera(currentFacingMode);
    });

    callCutBtn.addEventListener("click", () => {
      clearTimeout(disconnectGraceTimer);
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }
      resetSession();
      if (peer) {
        peer.destroy();
      }
      videoContainer.style.display = "none";
      thankyouScreen.style.display = "flex";
    });

    window.addEventListener("beforeunload", () => {
      resetSession();
    });

    startCamera(currentFacingMode);
  </script>
</body>
</html>
