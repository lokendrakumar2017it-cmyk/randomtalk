<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ishanvi Video Chat</title>
  
  <!-- PeerJS & Firebase SDKs -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .video-call-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #0b0f19;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* 1. User Fullscreen Video */
    #localVideo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      transform: scaleX(-1);
    }

    /* 2. Stranger Video Box */
    #remoteVideo {
      position: absolute;
      top: 75px;
      right: 16px;
      width: 150px;
      height: 210px;
      border-radius: 18px;
      object-fit: cover;
      background: #111827;
      border: 2px solid rgba(56, 189, 248, 0.8);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      z-index: 15;
    }

    /* Top Brand Header */
    .brand-header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(15, 23, 42, 0.85), transparent);
      z-index: 25;
    }

    .logo-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
    }

    .logo-icon svg {
      width: 18px;
      height: 18px;
      fill: #ffffff;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.3px;
      text-transform: capitalize;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }

    .brand-title span {
      color: #38bdf8;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: #4ade80;
      background: rgba(74, 222, 128, 0.15);
      padding: 4px 10px;
      border-radius: 14px;
      border: 1px solid rgba(74, 222, 128, 0.3);
      backdrop-filter: blur(4px);
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Status Badge on Video */
    .video-status {
      position: absolute;
      bottom: 24px;
      left: 18px;
      background: rgba(0, 0, 0, 0.65);
      color: #ffffff;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 20px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 25;
    }
  </style>
</head>
<body>

  <div class="video-call-container">
    <!-- Top Header -->
    <div class="brand-header">
      <div class="logo-box">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24">
            <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
          </svg>
        </div>
        <div class="brand-title">ishanvi <span>video chat</span></div>
      </div>
      <div class="live-badge">
        <span class="live-dot"></span>
        <span>LIVE</span>
      </div>
    </div>

    <!-- 1. Fullscreen User Video -->
    <video id="localVideo" autoplay playsinline muted></video>

    <!-- 2. Stranger Video Box -->
    <video id="remoteVideo" autoplay playsinline></video>

    <!-- Connection Status Badge -->
    <div class="video-status" id="videoStatus">Connecting...</div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBju6Q8VGk8iGz0yfnKw07-6RHKZfQt78E",
      authDomain: "randomtalk-9cd6c.firebaseapp.com",
      databaseURL: "https://randomtalk-9cd6c-default-rtdb.firebaseio.com",
      projectId: "randomtalk-9cd6c",
      storageBucket: "randomtalk-9cd6c.firebasestorage.app",
      messagingSenderId: "104855361284",
      appId: "1:104855361284:web:8f04006b2a1eb7a43ca251"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    const queueRef = db.ref("waiting_queue");

    const localVideo = document.getElementById("localVideo");
    const remoteVideo = document.getElementById("remoteVideo");
    const videoStatus = document.getElementById("videoStatus");

    let localStream = null;
    let peer = null;
    let myPeerId = null;
    let currentCall = null;

    async function startCamera() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        localVideo.srcObject = localStream;
        videoStatus.innerText = "Connecting...";
        initPeer();
      } catch (err) {
        videoStatus.innerText = "Camera Permission Required";
      }
    }

    function initPeer() {
      peer = new Peer({
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      });

      peer.on('open', (id) => {
        myPeerId = id;
        findMatch();
      });

      peer.on('call', (call) => {
        call.answer(localStream);
        setupCallHandlers(call);
      });
    }

    function findMatch() {
      videoStatus.innerText = "Connecting...";

      queueRef.once('value', (snapshot) => {
        const queue = snapshot.val() || {};
        const availablePeers = Object.keys(queue).filter(id => id !== myPeerId);

        if (availablePeers.length > 0) {
          const partnerId = availablePeers[0];
          queueRef.child(partnerId).remove();
          connectToStranger(partnerId);
        } else {
          queueRef.child(myPeerId).set(true);
          queueRef.child(myPeerId).onDisconnect().remove();
        }
      });
    }

    function connectToStranger(strangerId) {
      videoStatus.innerText = "Connecting...";
      const call = peer.call(strangerId, localStream);
      setupCallHandlers(call);
    }

    function setupCallHandlers(call) {
      currentCall = call;
      call.on('stream', (stream) => {
        remoteVideo.srcObject = stream;
        videoStatus.innerText = "Connected";
      });

      call.on('close', () => {
        handleDisconnect();
      });
    }

    function handleDisconnect() {
      resetSession();
      findMatch();
    }

    function resetSession() {
      if (currentCall) currentCall.close();
      remoteVideo.srcObject = null;
      videoStatus.innerText = "Connecting...";
      if (myPeerId) queueRef.child(myPeerId).remove();
    }

    window.addEventListener("beforeunload", () => {
      resetSession();
    });

    startCamera();
  </script>
</body>
</html>
